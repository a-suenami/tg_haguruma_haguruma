<label class="label" [for]="resolvedId()" [class.disabled]="isDisabled()">
  <input
    hidden
    type="radio"
    [id]="resolvedId()"
    [name]="resolvedName()"
    [value]="value()"
    [checked]="isChecked()"
    [disabled]="isDisabled()"
    (change)="changeValue($event)"
  />

  <span class="control"></span>
  <span class="text">
    <ng-content></ng-content>
  </span>
</label>
