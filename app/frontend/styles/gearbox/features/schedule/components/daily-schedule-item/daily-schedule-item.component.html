<div class="date">
  <span class="number">{{ schedule().date | dayjsFormat: 'DD' }}</span>
  <span class="day">{{ schedule().date | dayjsFormat: 'ddd' }}</span>
</div>
<div class="schedule-content">
  <div class="label">
    <cog-category-label>{{ schedule().category }}</cog-category-label>
  </div>
  <div class="title">{{ schedule().title }}</div>
</div>
