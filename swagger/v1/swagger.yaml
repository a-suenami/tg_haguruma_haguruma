---
openapi: 3.0.1
info:
  title: Haguruma API V1
  version: v1
  description: API documentation for Haguruma
paths:
  "/api/v1/contents":
    get:
      summary: List published content entries
      description: |
        Returns a list of published content entries.
        - Public content (no authorization tags): accessible without authentication
        - Protected content (with authorization tags): requires Bearer token authentication
      tags:
      - Contents
      security:
      - {}
      - bearer_auth: []
      parameters:
      - name: content_type
        in: query
        required: false
        description: Filter by content type unique_name (e.g., "article", "announcement")
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ContentEntry"
                required:
                - data
  "/api/v1/contents/{id}":
    get:
      summary: Get a published content entry
      description: |
        Returns a single published content entry.
        - Public content (no authorization tags): accessible without authentication
        - Protected content (with authorization tags): requires Bearer token authentication
      tags:
      - Contents
      security:
      - {}
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        description: Content entry ID
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContentEntryResponse"
        '403':
          description: forbidden - authentication required for protected content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/auth/idp/provider":
    get:
      summary: Get OAuth provider configuration
      description: Returns the information necessary for the OAuth client to construct the Authorization URL.
      tags:
      - Authentication
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OauthProviderResponse"
  "/api/v1/auth/idp/session":
    post:
      summary: Exchange ID token for session token
      description: |
        Verifies the ID token from the OAuth provider and issues a session token.
        The session token can be used as a Bearer token for subsequent API requests.
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: JWT ID token from OAuth provider
              required:
              - id_token
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionTokenResponse"
        '401':
          description: invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
servers:
- url: "{protocol}://{tenant}.{domain}"
  description: Multi-tenant API server (tenant identified by subdomain)
  variables:
    protocol:
      default: https
      enum:
      - https
      - http
      description: Protocol scheme
    tenant:
      default: your-tenant-id
      description: Tenant subdomain identifier
    domain:
      default: example.com
      description: Base domain
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: SessionToken
      description: |
        Session token obtained from POST /api/v1/auth/idp/session.
        Use the token value in the Authorization header: "Bearer {token}"
  schemas:
    ContentType:
      type: object
      properties:
        unique_name:
          type: string
          example: article
        display_name:
          type: string
          example: 記事
        is_collection:
          type: boolean
          example: true
      required:
      - unique_name
      - display_name
      - is_collection
    FieldMetadata:
      type: object
      properties:
        unique_name:
          type: string
          example: title
        display_name:
          type: string
          example: タイトル
      required:
      - unique_name
      - display_name
    TextAttribute:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
        field:
          "$ref": "#/components/schemas/FieldMetadata"
        text:
          type: object
          properties:
            value:
              type: string
              nullable: true
      required:
      - type
      - field
      - text
    RichtextAttribute:
      type: object
      properties:
        type:
          type: string
          enum:
          - richtext
        field:
          "$ref": "#/components/schemas/FieldMetadata"
        richtext:
          type: object
          properties:
            json_value:
              type: object
              nullable: true
              description: Lexical editor JSON format
      required:
      - type
      - field
      - richtext
    MediaAssetAttribute:
      type: object
      properties:
        type:
          type: string
          enum:
          - media_asset
        field:
          "$ref": "#/components/schemas/FieldMetadata"
        media_asset:
          type: object
          properties:
            media_type:
              type: string
              example: image
            s3_object_path:
              type: string
              example: tenant/2025/01/01/uuid.jpg
      required:
      - type
      - field
      - media_asset
    ContentEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content_type:
          "$ref": "#/components/schemas/ContentType"
        attributes:
          type: object
          additionalProperties:
            oneOf:
            - "$ref": "#/components/schemas/TextAttribute"
            - "$ref": "#/components/schemas/RichtextAttribute"
            - "$ref": "#/components/schemas/MediaAssetAttribute"
        version:
          type: integer
          example: 1
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - content_type
      - attributes
      - version
    ContentEntryResponse:
      type: object
      properties:
        data:
          "$ref": "#/components/schemas/ContentEntry"
      required:
      - data
    OauthProvider:
      type: object
      properties:
        client_id:
          type: string
          description: OAuth client ID
        endpoint_base:
          type: string
          description: OAuth provider endpoint base URL
          example: https://id-platform.net
        scopes:
          type: string
          description: Space-separated OAuth scopes
          example: openid profile email
      required:
      - client_id
      - endpoint_base
      - scopes
    OauthProviderResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            attributes:
              "$ref": "#/components/schemas/OauthProvider"
          required:
          - id
          - attributes
      required:
      - data
    SessionToken:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - created_at
      - expires_at
    SessionTokenResponse:
      type: object
      description: |
        The session token response. Use the `data.id` value as the Bearer token
        in the Authorization header for subsequent API requests.
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Session token value (use this as Bearer token)
            attributes:
              "$ref": "#/components/schemas/SessionToken"
          required:
          - id
          - attributes
      required:
      - data
    Error:
      type: object
      properties:
        error:
          oneOf:
          - type: string
          - type: object
            properties:
              type:
                type: string
                example: authentication_error
              code:
                type: string
                example: token_expired
              message:
                type: string
                example: Token has expired
