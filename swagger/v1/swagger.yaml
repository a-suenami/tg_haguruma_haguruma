---
openapi: 3.0.1
info:
  title: Haguruma API V1
  version: v1
  description: API documentation for Haguruma
paths:
  "/api/v1/auth/idp/provider":
    get:
      summary: Get OAuth provider information
      tags:
      - Authentication
      description: Returns the information necessary for the OAuth client to construct
        the Authorization URL
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  provider_type:
                    type: string
                  client_id:
                    type: string
                  authorization_endpoint:
                    type: string
                  scope:
                    type: string
                required:
                - id
                - name
                - provider_type
                - client_id
                - authorization_endpoint
        '401':
          description: unauthorized
  "/api/v1/auth/idp/session":
    post:
      summary: Create session with ID token
      tags:
      - Authentication
      description: Verifies the ID token and creates a session
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        description: Tenant ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: JWT ID token from IdP
              required:
              - id_token
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                required:
                - access_token
                - token_type
                - expires_in
        '401':
          description: unauthorized
servers:
- url: "{protocol}://{defaultHost}"
  variables:
    protocol:
      default: https
    defaultHost:
      default: localhost:3000
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
