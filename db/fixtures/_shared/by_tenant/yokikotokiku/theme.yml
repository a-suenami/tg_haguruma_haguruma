# 斧琴菊 (yokikotokiku) テーマ設定
#
# このファイルは seed-fu によって読み込まれ、
# TenantTheme レコードを作成/更新する際に使用される。

tenant_id: yokikotokiku

# 全体背景
page_background_color: "#FFFFFF"

# 一般（本文）テキスト
general_text_color: "#000000"
general_font_family: '"Noto Sans JP", sans-serif'

# ボーダー
border_color: "#E5E5E5"

# タイトル
title_text_color: "#000000"
title_font_family: '"Noto Serif JP", serif'

# ナビゲーション
navigation_text_color: "#000000"
navigation_font_family: '"Noto Serif JP", serif'

# リンク
link_text_color: "#004678"
link_underline: true

# タブ
tab_font_family: '"Noto Sans JP", sans-serif'
tab_active_text_color: "#004678"
tab_active_underline_color: "#004678"
tab_inactive_text_color: "#666666"
tab_inactive_underline_color: "#FFFFFF"

# 補助テキスト
caption_text_color: "#666666"
caption_font_family: '"Noto Sans JP", sans-serif'

# ラベル
label_background_color: "#004678"
label_text_color: "#FFFFFF"
label_font_family: '"Noto Sans JP", sans-serif'

# ボタン（共通）
button_font_family: '"Noto Sans JP", sans-serif'

# ボタン（Primary）
button_primary_background_color: "#004678"
button_primary_text_color: "#FFFFFF"

# ボタン（Secondary）
button_secondary_border_color: "#004678"
button_secondary_background_color: "#FFFFFF"
button_secondary_text_color: "#004678"
