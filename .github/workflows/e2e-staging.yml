name: E2E Tests (Staging)

on:
  # Trigger after deployment to staging
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging environment URL'
        required: true
        default: 'https://staging.example.com'
  # Or trigger on deployment event
  deployment_status:

env:
  AUTH_BYPASS: 'false'

jobs:
  e2e-staging:
    name: E2E Smoke Tests (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on successful deployment to staging
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'staging')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E smoke tests against staging
        run: npx playwright test --project=staging tests/smoke/
        working-directory: e2e
        env:
          BASE_URL: ${{ github.event.inputs.staging_url || github.event.deployment.payload.web_url || 'https://staging.example.com' }}
          AUTH_BYPASS: 'false'
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          TEST_TENANT_ID: ${{ secrets.E2E_TEST_TENANT_ID }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-staging
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts-staging
          path: |
            e2e/test-results/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "E2E tests failed on staging environment!"
          # Add Slack/Discord notification here if needed
