# ==============================================================================
# docker-compose
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  app: &haguruma-app-base
    # ----------------------------------------------------------------------------
    build:
      context: .
      dockerfile: docker/local.Dockerfile
      args:
        RAILS_ENV: development
    command: bundle exec rails server -b 0.0.0.0 -p '3001'
    ports:
      - '3001:3001'
    links:
      - postgres
      - redis
    env_file:
      - .env.local
      - secrets.env
    extra_hosts:
      - "dev-tenant.localhost:host-gateway"
    environment:
      LANG: 'C.UTF-8'
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
      RUBYOPT: '-W:no-deprecated -W:no-experimental'
      RUBOCOP_CACHE_ROOT: 'tmp/rubocop_cache'
      VITE_RUBY_HOST: vite-dev-server
    volumes:
      - .:/rails_app
      - bundle-data:/usr/local/bundle
    stdin_open: true
    tty: true

  # ----------------------------------------------------------------------------
  vite-dev-server:
    # ----------------------------------------------------------------------------
    <<: *haguruma-app-base
    build:
      context: .
      dockerfile: docker/local.Dockerfile
      args:
        RAILS_ENV: development
    command: ./bin/vite dev
    environment:
      VITE_RUBY_HOST: '0.0.0.0'
    ports:
      - '3037:3036'

  # ----------------------------------------------------------------------------
  worker:
    # ----------------------------------------------------------------------------
    <<: *haguruma-app-base
    build:
      context: .
      dockerfile: docker/local.Dockerfile
      args:
        RAILS_ENV: development
    ports: []
    command: bundle exec sidekiq

  # ----------------------------------------------------------------------------
  postgres:
    # ----------------------------------------------------------------------------
    image: postgres:16-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ----------------------------------------------------------------------------
  redis:
    # ----------------------------------------------------------------------------
    image: redis:7-alpine
    ports:
      - '6380:6379'
    command: [redis-server, --loglevel, notice]
    volumes:
      - redis-data:/data

  # ----------------------------------------------------------------------------
  # minio: DISABLED - Using shared Auth Platform Minio (localhost:9000)
  # ----------------------------------------------------------------------------
  # To use shared Minio, ensure Auth Platform is running first:
  #   cd ../auth-platform && source env.sh && up
  # ----------------------------------------------------------------------------
  # minio:
  #   image: minio/minio:latest
  #   ports:
  #     - '9002:9000'
  #     - '9003:9001'
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio-data:/data
  #
  # minio-init:
  #   image: minio/mc:latest
  #   depends_on:
  #     - minio
  #   entrypoint: >
  #     /bin/sh -c "
  #     mc alias set local http://minio:9000 minioadmin minioadmin;
  #     mc mb local/haguruma-media --ignore-existing;
  #     mc anonymous set download local/haguruma-media;
  #     "
  # ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
volumes:
  # ----------------------------------------------------------------------------
  bundle-data: {}
  postgres-data: {}
  redis-data: {}
  # minio-data: {}  # DISABLED - Using shared Auth Platform Minio
