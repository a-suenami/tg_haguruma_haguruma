# ------------------------------------------------------------------------------
# Scheduled jobs
# ------------------------------------------------------------------------------
bundle-audit:
  image: ${RUBY_IMAGE}
  cache:
    <<: *cache
    policy: pull
  variables:
    RAILS_ENV: test
  before_script:
    - /bin/sh docker/scripts/bundle_install.sh
  script:
    - bundle exec bundle-audit check --update
  only:
    - schedules
