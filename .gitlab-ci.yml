  script:
    - aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 430013787765.dkr.ecr.ap-northeast-1.amazonaws.com
    - echo $CI_COMMIT_SHA > REVISION
    - docker build . -f docker/Dockerfile -t rails_app:latest --build-arg BUNDLE_GIT__L__TWOGATE__NET
    - docker tag rails_app:latest 430013787765.dkr.ecr.ap-northeast-1.amazonaws.com/triple-main-app-prod:latest
    - docker tag rails_app:latest 430013787765.dkr.ecr.ap-northeast-1.amazonaws.com/triple-main-app-prod:$CI_COMMIT_SHA
    - docker push 430013787765.dkr.ecr.ap-northeast-1.amazonaws.com/triple-main-app-prod:latest
    - docker push 430013787765.dkr.ecr.ap-northeast-1.amazonaws.com/triple-main-app-prod:$CI_COMMIT_SHA
  tags:
    - docker
    - x86_64-linux
  only:
    - deploy-production
  except:
    - schedules

# ------------------------------------------------------------------------------
# Deploy Staging jobs
# ------------------------------------------------------------------------------
.deploy:staging:base: &deploy-staging-base
  image: containers.l.twogate.net/docker/ecspresso:master
  cache: {}
  variables:
    AWS_ASSUME_ROLE_ARN: arn:aws:iam::218794653131:role/ecspresso-ecs-role
  before_script:
    - STS=`aws sts assume-role --role-arn $AWS_ASSUME_ROLE_ARN --role-session-name ecspresso-$CI_PROJECT_ID-$CI_JOB_ID`;export AWS_ACCESS_KEY_ID=`echo "${STS}" | jq -r '.Credentials.AccessKeyId'`;export AWS_SECRET_ACCESS_KEY=`echo "${STS}" | jq -r '.Credentials.SecretAccessKey'`;export AWS_SESSION_TOKEN=`echo "${STS}" | jq -r '.Credentials.SessionToken'`
  only:
    - deploy-staging
  except:
    - schedules

🔍 pre-deploy:diff:app:staging:
  <<: *deploy-staging-base
  stage: pre-deploy
  script:
    - ecspresso diff --color --ext-str APP_IMAGE_TAG=$CI_COMMIT_SHA --config ecspresso/stg/services/app/config.yaml

👍 pre-deploy:approval:staging:
  <<: *deploy-staging-base
  stage: pre-deploy
  script:
    - ecspresso deploy --dry-run --ext-str APP_IMAGE_TAG=$CI_COMMIT_SHA --config ecspresso/stg/services/app/config.yaml
  when: manual

🔧 deploy:migration:staging:
  <<: *deploy-staging-base
  stage: deploy
  script:
    - ecspresso run --watch-container app --ext-str APP_IMAGE_TAG=$CI_COMMIT_SHA --config ecspresso/stg/tasks/config.yaml --task-def ecspresso/stg/tasks/oneshot-task-def.jsonnet --overrides '{"containerOverrides":[{"name":"app","command":["bundle","exec","rails","ridgepole:apply"]}]}'
  needs:
    - job: 👍 pre-deploy:approval:staging
      artifacts: false

🔧 deploy:migration:qa:
  <<: *deploy-staging-base
  stage: deploy
  script:
    - ecspresso run --watch-container app --ext-str APP_IMAGE_TAG=$CI_COMMIT_SHA --config ecspresso/qa/tasks/config.yaml --task-def ecspresso/qa/tasks/oneshot-task-def.jsonnet --overrides '{"containerOverrides":[{"name":"app","command":["bundle","exec","rails","ridgepole:apply"]}]}'
  needs:
    - job: 👍 pre-deploy:approval:staging
      artifacts: false

🚀 deploy:app:staging:
  <<: *deploy-staging-base
  stage: deploy
  script:
    - ecspresso deploy --ext-str APP_IMAGE_TAG=$CI_COMMIT_SHA --config ecspresso/stg/services/app/config.yaml
  needs:
    - job: 👍 pre-deploy:approval:staging
      artifacts: false
    - job: 🔧 deploy:migration:staging
      artifacts: false

🚀 deploy:worker:staging:
  <<: *deploy-staging-base
  stage: deploy
  script:
    - ecspresso deploy --ext-str APP_IMAGE_TAG=$CI_COMMIT_SHA --config ecspresso/stg/services/worker/config.yaml
  needs:
    - job: 👍 pre-deploy:approval:staging
      artifacts: false
    - job: 🔧 deploy:migration:staging
      artifacts: false

🚀 deploy:poller:staging:
  <<: *deploy-staging-base
  stage: deploy
  script:
    - ecspresso deploy --ext-str APP_IMAGE_TAG=$CI_COMMIT_SHA --config ecspresso/stg/services/eventbridge_poller/config.yaml
  needs:
    - job: 👍 pre-deploy:approval:staging
      artifacts: false
    - job: 🔧 deploy:migration:staging
      artifacts: false

🚀 deploy:app:qa:
  <<: *deploy-staging-base
  stage: deploy
  script:
    - ecspresso deploy --ext-str APP_IMAGE_TAG=$CI_COMMIT_SHA --config ecspresso/qa/services/app/config.yaml
  needs:
    - job: 👍 pre-deploy:approval:staging
      artifacts: false
    - job: 🔧 deploy:migration:qa
