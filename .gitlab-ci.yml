# ------------------------------------------------------------------------------
# Post deploy jobs
# ------------------------------------------------------------------------------
.autify-test-base: &autify-test-base
  stage: post-deploy
  image: ubuntu:latest
  before_script:
    - apt-get update && apt-get install -y curl
    - curl https://autify-cli-assets.s3.amazonaws.com/autify-cli/channels/stable/install-standalone.sh | sh

🐝 autify-test:staging:
  <<: *autify-test-base
  needs:
    - job: 🚀 deploy:app:staging
      artifacts: false
    - job: 🚀 deploy:worker:staging
      artifacts: false
    - job: 🚀 deploy:poller:staging
      artifacts: false
  script:
    # autify用テナントでの検証
    - autify web test run https://app.autify.com/projects/580/test_plans/664137
    # 各種IDPとの連携検証
    - autify web test run https://app.autify.com/projects/580/test_plans/658394
    # Admin画面の検証
    - autify web test run https://app.autify.com/projects/580/test_plans/623632
  only:
    - deploy-staging
  except:
    - schedules

# ------------------------------------------------------------------------------
# Scheduled jobs
# ------------------------------------------------------------------------------
bundle-audit:
  image: ${RUBY_IMAGE}
  cache:
    <<: *cache
    policy: pull
  variables:
    RAILS_ENV: test
  before_script:
    - /bin/sh docker/scripts/bundle_install.sh
  script:
    - bundle exec bundle-audit check --update
  only:
    - schedules
